<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introuvable · Bébou</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b0908; color: #f7f2e8; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 18px; color: #9a8d80; }
  a { color: #f0a58f; }
</style>
</head>
<body>
<main>
  <h1>Cette page n'existe pas</h1>
  <p>Le fichier demandé est introuvable (ou une nouvelle version du jeu vient d'être mise en ligne).</p>
  <p><a href="/jeu/">Retour au jeu</a></p>
</main>
<script>
  // (version anglaise, lot 6) même règle que le jeu : choix enregistré, sinon langue de l'appareil (fr, fr-FR, fr-BE, fr-CH)
  (function () {
    try {
      var st = null;
      try { st = localStorage.getItem('bebou.lang'); } catch (e) {}
      var d = ((navigator.languages && navigator.languages[0]) || navigator.language || '').trim().toLowerCase().replace('_', '-');
      var l = st === 'en' || st === 'fr' ? st : ['fr', 'fr-fr', 'fr-be', 'fr-ch'].indexOf(d) >= 0 ? 'fr' : 'en';
      if (l !== 'en') return;
      document.documentElement.lang = 'en';
      document.title = 'Not found · Bébou';
      var t = document.querySelectorAll('main h1, main p');
      t[0].textContent = 'This page doesn’t exist';
      t[1].textContent = 'The requested file can’t be found (or a new version of the game has just been released).';
      t[2].firstChild.textContent = 'Back to the game';
    } catch (e) {}
  })();
</script>
</body>
</html>
