<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- zoom autorisé (accessibilité) ; le double-tap ne zoome pas : touch-action: manipulation (style.css) ;
         Android Chrome : le clavier réduit la page (le volet d'échange et ses champs restent visibles, UX5-18) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Bébou — cartes</title>
    <meta name="description" content="Le jeu de cartes à collectionner du groupe : boosters, collection, contrats et échanges." />
    <meta property="og:title" content="Bébou — cartes" />
    <meta property="og:description" content="Ouvre des boosters, complète ta collection, échange tes doublons. Entre nous." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bébou" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://cardgamepriv.pages.dev/jeu/" />
    <meta property="og:image" content="https://cardgamepriv.pages.dev/og-bebou.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cardgamepriv.pages.dev/og-bebou.jpg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/bebou-fav-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/bebou-fav-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="../icons/bebou-fav-48.png" />
    <link rel="apple-touch-icon" href="../icons/bebou-180.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bébou" />
    <!-- ajouté à l'écran d'accueil : plein écran (plus de barre d'URL ni de geste « page précédente » de Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- (version anglaise) langue choisie AVANT le premier dessin (même règle que src/game/lang.ts ; liste des langues
         françaises injectée au build depuis src/core/i18n.ts) : <html lang>, titre de l'onglet, écran de chargement -->
    <script>
      (function () {
        try {
          var L = '__BEBOU_FR_DEVICE_LANGS__'.split(',');
          var q = new URLSearchParams(location.search).get('lang');
          var st = null;
          try { st = localStorage.getItem('bebou.lang'); } catch (e) {}
          var d = ((navigator.languages && navigator.languages[0]) || navigator.language || '').trim().toLowerCase().replace('_', '-');
          var l = q === 'en' || q === 'fr' ? q : st === 'en' || st === 'fr' ? st : L.indexOf(d) >= 0 ? 'fr' : 'en';
          document.documentElement.lang = l;
          if (l === 'en') {
            document.title = 'Bébou — cards';
            // (version anglaise, lot 6) installation sur l'écran d'accueil : nom et description en anglais
            var mf = document.querySelector('link[rel=manifest]');
            if (mf) mf.setAttribute('href', '../manifest.en.webmanifest');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- écran de chargement visible dès la première image, pendant que le jeu (3D) se télécharge ; main.ts le reprend -->
    <div id="app"><div class="loader"><div class="l-logo">BÉBOU</div><div class="l-bar"><i style="width: 5%"></i></div><div class="l-txt">chargement…</div><div class="l-tip"></div></div></div>
    <script>
      if (document.documentElement.lang === 'en') document.querySelector('.l-txt').textContent = 'loading…';
    </script>
    <script>
      // Barre de chargement « vivante » (retours de Tom, 4 nov. : sur téléphone elle restait figée). Animée par le
      // compositeur (transform, Web Animations) : elle avance même quand le téléchargement / l'analyse du jeu occupe
      // tout le processeur. Elle file vers un plafond qui monte à chaque vraie étape (main.ts → __bootBar.step), sans
      // jamais reculer ; « c'est prêt » = elle se remplit d'un coup.
      (function () {
        var el = document.querySelector('.l-bar i');
        if (!el || !el.animate) return;
        el.style.cssText = 'width:100%;transition:none;transform-origin:0 50%;transform:scaleX(.04)';
        var anim = null;
        function cur() {
          var m = getComputedStyle(el).transform.match(/matrix\(([^,]+)/);
          return m ? parseFloat(m[1]) : 0.04;
        }
        function go(from, to, ms, ease) {
          if (anim) anim.cancel();
          anim = el.animate([{ transform: 'scaleX(' + from + ')' }, { transform: 'scaleX(' + to + ')' }], { duration: ms, easing: ease || 'cubic-bezier(.12,.72,.24,1)', fill: 'forwards' });
        }
        go(0.04, 0.45, 9000);
        window.__bootBar = {
          step: function (pct) {
            var c = cur();
            if (pct >= 100) return go(c, 1, 260, 'ease-out');
            var s = pct < 35 ? [0.58, 9000] : pct < 85 ? [0.93, 12000] : [0.98, 2500];
            go(Math.max(c, pct / 100), Math.max(c, s[0]), s[1]);
          },
        };
      })();
    </script>
    <script>
      // PREMIER LANCEMENT : progression RÉELLE du téléchargement du jeu (V2 fluidité, lot 1). /precache.json donne la
      // liste et la taille des fichiers du socle ; on suit ceux que le navigateur a fini de recevoir. Rien ne s'affiche
      // quand tout vient du cache (lancements suivants). Une coupure ne fait rien perdre : au rechargement, les
      // fichiers déjà reçus sortent du cache et le compteur repart d'où il était.
      (function () {
        var txt = document.querySelector('.l-txt');
        if (!txt || !window.PerformanceObserver || !window.fetch) return;
        // (audit 12/11, A1-09) réponse gardée pour game/bundle.ts, qui redemandait le même fichier 4,5 s plus tard
        (window.__precache = fetch('../precache.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; }))
          .then(function (man) {
            if (!man || !man.files) return;
            var size = {}, total = 0, got = 0, net = 0, seen = {};
            man.files.forEach(function (f) { if (f[2] === 0) { size[new URL('../' + f[0], location.href).href] = f[1]; total += f[1]; } });
            function add(list) {
              list.forEach(function (e) {
                var s = size[e.name];
                if (!s || seen[e.name]) return;
                seen[e.name] = 1; got += s; net += e.transferSize || 0;
              });
              // (main.ts reprend le texte dès qu'il démarre : on ne touche qu'au texte d'attente)
              if (net > 20000 && got < total && /^(chargement|téléchargement|loading|downloading)/.test(txt.textContent)) {
                var en = document.documentElement.lang === 'en';
                txt.textContent = (en ? 'downloading the game · ' : 'téléchargement du jeu · ') + Math.min(99, Math.round((got / total) * 100)) + (en ? '%' : ' %');
              }
            }
            add(performance.getEntriesByType('resource'));
            try { new PerformanceObserver(function (l) { add(l.getEntries()); }).observe({ type: 'resource', buffered: true }); } catch (e) {}
          })
          .catch(function () {});
      })();
    </script>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
